server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://yamanote.proxy.rlwy.net:25762/railway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: iLCWfqaDcaUtZLHyWBPrSIxTKGZarNXd
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 86400000
    refresh-expiration: 604800000

  file:
    # FIX: Use ${user.home} so the path is always absolute and consistent
    # regardless of which directory Eclipse/STS launches the app from.
    # Files will be stored at: C:\Users\YourName\edulib-uploads  (Windows)
    #                      or: /home/yourname/edulib-uploads      (Linux/Mac)
    #
    # To override: set env var  FILE_UPLOAD_DIR=C:/my/custom/path
    upload-dir: ${FILE_UPLOAD_DIR:${user.home}/edulib-uploads}
    allowed-types: application/pdf

logging:
  level:
    com.edulib: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/edulib.log
